<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D World Game</title>
    <link rel="stylesheet" href="style.css">
    <!-- Load Three.js -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>
</head>
<body>
    <div id="hud"><b>Joystick</b> (left) = move | <b>Drag screen</b> = look</div>
    <div id="status">Walk to the chair to sit down.</div>

    <div id="joystick-zone"><div id="joystick-knob"></div></div>

    <div class="btn" id="btn-sit-chair">SIT ON CHAIR</div>
    <div class="btn" id="btn-jump">JUMP</div>
    <div class="btn" id="btn-sprint">SPRINT</div>

    <script type="module" src="game.js"></script>
</body>
</html>
